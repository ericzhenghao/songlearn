<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SongLearn · 听歌学外语 · 共享曲库</title>
    <meta name="description" content="上传歌曲自动识曲、歌词逐句对齐、音标翻译跟唱。曲库是项目资产：免费共享曲库，链接发朋友圈，人人一起攒歌。" />
    <meta name="theme-color" content="#0b1120" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=ZCOOL+QingKe+HuangYou&family=Noto+Sans+SC:wght@400;500;700;900&family=JetBrains+Mono:ital,wght@0,400;0,600;0,800;1,400&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=ZCOOL+QingKe+HuangYou&family=Noto+Sans+SC:wght@400;500;700;900&family=JetBrains+Mono:ital,wght@0,400;0,600;0,800;1,400&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <style>
      /* 内联样式确保主题色立即生效，避免闪烁 */
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
      }
      html.light,
      html.light body {
        background-color: #ffffff !important;
        color: #000000;
      }
      html.dark,
      html.dark body {
        background-color: #1a1a1a !important;
        color: #ffffff;
      }
    </style>
    <script>
      // 在 React 加载前立即设置主题，避免闪烁
      (function () {
        const isInIframe = window.self !== window.top;

        function applyThemeToDOM(theme) {
          document.documentElement.classList.remove("light", "dark");
          document.documentElement.classList.add(theme);
          document.documentElement.setAttribute("data-theme", theme);
        }

        if (isInIframe) {
          // 监听父窗口主动推送的主题消息
          window.addEventListener("message", function (event) {
            if (event.data && typeof event.data.theme === "string") {
              const theme = event.data.theme;
              if (theme === "light" || theme === "dark") {
                applyThemeToDOM(theme);
              }
            }
          });
        } else {
          // 非 iframe 环境，使用默认 light 主题
          applyThemeToDOM("light");
        }
      })();
    </script>
      <script>
      (function () {
        if (window.self === window.top) return;
        var reported = {};
        window.addEventListener("error", function (event) {
          // 资源加载失败的 error 事件没有 message，此处仅上报 JS 运行时错误
          if (!event || !event.message) return;
          var key =
            event.message + "|" + (event.filename || "") + "|" + (event.lineno || 0);
          if (reported[key]) return; // 相同错误只上报一次，避免渲染循环刷屏
          reported[key] = true;
          try {
            window.parent.postMessage(
              {
                type: "sandbox-runtime-error",
                payload: {
                  message: String(event.message).slice(0, 500),
                  filename: event.filename || "",
                  lineno: event.lineno || 0,
                  colno: event.colno || 0,
                  stack:
                    event.error && event.error.stack
                      ? String(event.error.stack).slice(0, 2000)
                      : ""
                }
              },
              "*"
            );
          } catch (e) {
            /* 上报失败不影响页面运行 */
          }
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
